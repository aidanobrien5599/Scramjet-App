<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Browser</title>

		<link rel="shortcut icon" content="favicon.webp" />

		<script src="/scram/scramjet.patched.js"></script>
		<script src="/baremux/index.js"></script>

		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div class="flex-center header-center logo-wrapper">
			<h1>☘ Search</h1>
		</div>

		<form id="sj-form" class="flex-center">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="sj-address" type="text" placeholder="Search Google or enter URL…" autofocus autocomplete="off" />
		</form>
		<div class="flex-center links">
			<a href="#" class="quick-link" data-url="https://www.coolmathgames.com">Cool Math Games</a>
			<a href="#" class="quick-link" data-url="https://aidanpobrien.com">aidanpobrien.com</a>
			<a href="#" class="quick-link" data-url="https://en.wikipedia.org">Wikipedia</a>
			<a href="#" class="quick-link" data-url="https://badgerbase.app">BadgerBase</a>
		</div>
		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
	</body>
</html>
